name: Desktop

# The workflow-board desktop app (Wails v2) is a cgo backend and CANNOT be
# cross-compiled: Linux uses webkit2gtk+gtk3, macOS uses the Obj-C toolchain. So
# it is built on a per-OS matrix, each row with its own native toolchain.
# Windows is deliberately absent: its row took ~8 minutes against ~1-2 for the
# others and sat in front of every desktop merge. The windows/amd64 CLI binary
# still ships from the release build, which cross-compiles without a runner.
# This is intentionally a SEPARATE workflow from ci.yml
# — the main lint/test/build jobs run on a plain Linux runner with no webview
# headers, and the `wailsapp` build tag keeps the cgo path out of `go vet ./...`,
# `go list ./...` and `go build .` so those jobs stay green without GTK installed.

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"

# One run per ref: supersede the in-progress matrix build on a new push to the
# same branch/PR rather than running stale multi-OS builds in parallel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The frontend's node:test suite. It needs no webview, so it runs once on
  # Linux rather than per matrix row, and as its own job rather than a step
  # inside the build: `wails build` only compiles the frontend, so until this
  # job existed nothing in CI ever executed these tests. That gap is not
  # hypothetical — SC-637's banner-clobber guard was reintroduced at a new call
  # site while its test file sat green and unexecuted. Deliberately parallel to
  # (not a gate on) the build: a failure here must surface as its own red check
  # without also withholding the build artifacts used to investigate it.
  frontend-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - run: npm ci
        working-directory: desktop/frontend
      # tsc emits to build/, which the behavioural tests import from. This also
      # regenerates dist/ from bundle.mjs, so by the time the tests below read
      # dist/board.js it is always freshly built from the current src/ — the
      # dist half of board-error-guard.test.mjs would otherwise be tautological
      # in CI, unable to catch a dist/ that lagged a fixed src/ the way it can
      # locally. Diff dist/ against what's committed first so a stale dist/ is
      # its own failure, distinct from the guard test.
      - run: npm run build
        working-directory: desktop/frontend
      - run: git diff --exit-code -- dist
        working-directory: desktop/frontend
      - run: npm test
        working-directory: desktop/frontend

  build:
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 24.04 only ships WebKitGTK 4.1, so the Linux cgo build needs the
        # `webkit2_41` Wails tag to pkg-config the 4.1 .pc instead of the absent
        # 4.0 one. The tag is a Linux-only no-op elsewhere, but scope it per-row.
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
            tags: "wailsapp,webkit2_41"
          - os: macos-14
            platform: darwin/universal
            tags: "wailsapp"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      # Linux WebKitGTK headers — required for the cgo webview backend. The 4.1
      # dev package is the current name on Ubuntu 24.04; fall back to 4.0 on
      # older images.
      - name: Install Linux webview deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev || \
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      # macOS uses the system Obj-C/WebKit toolchain; nothing to install.

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build desktop app
        run: wails build -tags "${{ matrix.tags }}" -platform ${{ matrix.platform }}
        working-directory: desktop

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: human-board-${{ matrix.os }}
          path: desktop/build/bin/
          if-no-files-found: warn
